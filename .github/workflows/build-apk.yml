name: Build and diagnose NEXUS AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project archive
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="."
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "No Android project ZIP found in repository root."
              exit 1
            fi
            mkdir -p _android_project
            python3 -m zipfile -e "$ZIP_FILE" _android_project
            SETTINGS_FILE="$(find _android_project -maxdepth 8 -name settings.gradle.kts -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "No Gradle settings file was found inside the ZIP."
              find _android_project -maxdepth 5 -type f | head -200
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project directory: $PROJECT_DIR"

      - name: Diagnose Firebase and Android configuration (safe summary only)
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          {
            echo "=== Project files (first 250) ==="
            find . -maxdepth 7 -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'AndroidManifest.xml' -o -name 'google-services.json' -o -name 'GoogleService-Info.plist' -o -name 'firebase.json' -o -name 'package.json' -o -name '*.kt' -o -name '*.java' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' \) | head -250
            echo "=== Firebase identifiers (no API keys or secrets) ==="
            python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          for p in root.rglob('google-services.json'):
              try:
                  d=json.loads(p.read_text(errors='ignore'))
                  pi=d.get('project_info',{})
                  print(f"{p}: project_id={pi.get('project_id','NOT_FOUND')}")
                  for c in d.get('client',[]):
                      ci=c.get('client_info',{})
                      ai=ci.get('android_client_info',{})
                      print(f"  app_id={ci.get('mobilesdk_app_id','NOT_FOUND')} package={ai.get('package_name','NOT_FOUND')}")
              except Exception as e: print(f"{p}: parse_error={type(e).__name__}")
          print("=== Relevant source files (secrets redacted) ===")
          targets=[
              'app/src/main/java/com/example/AppCheckHelper.kt',
              'app/src/main/java/com/example/MainActivity.kt',
              'app/src/main/java/com/example/data/ai/FirebaseNexusAiProvider.kt',
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
          ]
          for name in targets:
              p=pathlib.Path(name)
              if not p.exists():
                  print(f"--- MISSING: {name} ---")
                  continue
              print(f"--- {name} ---")
              for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                  if any(word in line.lower() for word in ('api_key','apikey','secret','password','token','authorization','bearer')):
                      line='[REDACTED: sensitive configuration line]'
                  print(f"{i}: {line[:500]}")
          PY
          } | tee "$GITHUB_WORKSPACE/nexus-diagnostic-report.txt"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK (does not need release signing secrets)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NEXUS-AI-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/NEXUS-AI-debug.apk"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-debug-apk
          path: NEXUS-AI-debug.apk
          retention-days: 30

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-diagnostic-report
          path: nexus-diagnostic-report.txt
          if-no-files-found: warn
          retention-days: 30
