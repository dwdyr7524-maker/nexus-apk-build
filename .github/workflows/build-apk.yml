name: Build NEXUS AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project archive
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="."
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "No Android project ZIP found in repository root."
              exit 1
            fi
            mkdir -p _android_project
            python3 -m zipfile -e "$ZIP_FILE" _android_project
            SETTINGS_FILE="$(find _android_project -maxdepth 5 -name settings.gradle.kts -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "settings.gradle.kts was not found inside the ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project directory: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug signing key
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          [ -f .env.example ] || touch .env.example

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NEXUS-AI-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/NEXUS-AI-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-debug-apk
          path: NEXUS-AI-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: NEXUS AI - APK להתקנה
          body: APK שנבנה אוטומטית מתוך קובץ הפרויקט שהועלה למאגר.
          files: NEXUS-AI-debug.apk
          make_latest: true
