name: Build NEXUS AI Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project archive
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="."
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "No Android project ZIP found in repository root."
              exit 1
            fi
            mkdir -p _android_project
            python3 -m zipfile -e "$ZIP_FILE" _android_project
            SETTINGS_FILE="$(find _android_project -maxdepth 5 -name settings.gradle.kts -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "settings.gradle.kts was not found inside the ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project directory: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Missing signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          cd "${{ steps.project.outputs.dir }}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias upload >/dev/null
          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          [ -f .env.example ] || touch .env.example

      - name: Build signed release APK
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/NEXUS-AI-release.apk"
          ls -lh "$GITHUB_WORKSPACE/NEXUS-AI-release.apk"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apksigner verify --verbose "$GITHUB_WORKSPACE/NEXUS-AI-release.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-release-apk
          path: NEXUS-AI-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: NEXUS AI - Release APK חתום
          body: גרסת Release חתומה דיגיטלית של NEXUS AI.
          files: NEXUS-AI-release.apk
          make_latest: true
